# btrbk (KUB-129): hourly local snapshots of @ / @home under /mnt/btr_pool (subvolid=5 mount, see mnt-btr_pool.mount)
# + incremental send to kbs.lan. Remote half needs the owner ticket (key in /etc/btrbk/ssh, kbs authorized_keys, dest subvol).

# Logging and locking
transaction_log            /var/log/btrbk.log
lockfile                   /run/lock/btrbk.lock

# Use sudo for btrfs commands
backend_local_user         btrfs-progs-sudo

# Performance settings optimized for 2.5G LAN
# Local buffer (sender side) - using mbuffer if available (version 20180505+)
stream_buffer              1g
# Remote buffer (receiver side) - adds buffering on kbs.lan
stream_buffer_remote       1g
# DISABLED: Eliminates double compression (filesystem already uses zstd:1)
# Source filesystem compression is sufficient for LAN transfers
stream_compress            no
ssh_compression            no

# Timestamp format
timestamp_format           long

# Create snapshots only when changes detected
snapshot_create            onchange

# Use incremental backups to maintain chain from base
# The retention policy will create a sparse chain
incremental                yes

# Local snapshot retention (minimal for laptop space)
snapshot_preserve_min      latest
snapshot_preserve          7d

# Target retention on kbs.lan
target_preserve_min        latest  
target_preserve           7d 4w

# Archive retention (btrbk archive, unused today)
archive_preserve_min       latest
archive_preserve           7d 4w 12m *y

# SSH configuration for network backup
ssh_identity     /etc/btrbk/ssh/id_ed25519
ssh_user         root
backend_remote   btrfs-progs-sudo

# Main volume: top-level (subvolid=5) of /dev/mapper/root mounted at /mnt/btr_pool.
# snapshot_dir must exist: /mnt/btr_pool/btrbk_snapshots
volume /mnt/btr_pool
  snapshot_dir     btrbk_snapshots
  target           ssh://kbs.lan/mnt/hdd/omarchy

  # Subvolumes to snapshot (live names: subvol=/@ and /@home)
  subvolume   @
  subvolume   @home
