[settings]
default_target_type = "symbolic"

# config/ holds exactly four dirs:
#   shared/  → ~/.config/*   plain configs, every host   (one-line recursive map)
#   linux/   → ~/.config/*   plain Arch-only configs     (one-line recursive map)
#   mac/     → ~/.config/*   plain macOS-only configs    (one-line recursive map)
#   custom/  → configs needing special handling (templating, single-dir symlink,
#              or a target outside ~/.config); listed individually below.
# Add a plain config = drop the dir into shared/linux/mac, no edit here.
# Hosts pick packages in .dotter/<hostname>.toml: macOS=["macos"], Arch=["arch"].
[base.files]
"local" = "~/.local"
"config/shared" = "~/.config"
"config/custom/ghostty" = { target = "~/.config/ghostty", type = "template" }
"config/custom/nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }
"config/custom/git/gitconfig" = { target = "~/.gitconfig", type = "template" }
"config/custom/git/gitignore" = "~/.gitignore"
"config/custom/ssh" = { target = "~/.ssh", type = "template" }
"config/custom/zsh" = "~/.config/zsh"
"config/custom/zsh/.zshenv" = "~/.zshenv"
"config/custom/.markdownlint.jsonc" = "~/.markdownlint.jsonc"
"config/custom/pnpm/global-packages.txt" = "~/.config/pnpm/global-packages.txt"
"config/custom/pi/agent" = "~/.config/pi/agent"
# @firstpick/pi-extension-tools (/tools) resource defaults; path via PI_WEBUI_SETTINGS_FILE in .zshenv
"config/custom/pi/webui/settings.json" = "~/.config/pi/webui/settings.json"
# tessl global skill manifest (which plugins/skills are installed; excludes derived from it).
# After changing: tessl install -g ... then tessl-cock-prefix. Do NOT run tessl inside ~/.tessl.
"config/custom/tessl/tessl.json" = "~/.tessl/tessl.json"

# own agent skills (punk-*); deployed next to tessl__* symlinks managed by tessl-cock-prefix.
"config/custom/agents/skills" = "~/.agents/skills"

# ─── Linux desktop (Hyprland stack) ───
[linux.files]
"config/linux" = "~/.config"

# ─── macOS (AeroSpace stack) ───
[macos]
depends = ["base"]

[macos.files]
"config/mac" = "~/.config"
"config/custom/karabiner" = { target = "~/.config/karabiner", type = "symbolic", recurse = false }
"config/custom/a-bar/a-barrc" = "~/.a-barrc"
"config/custom/hammerspoon" = { target = "~/.hammerspoon", type = "symbolic", recurse = false }
"config/custom/launchagents/com.user.borders.plist" = { target = "~/Library/LaunchAgents/com.user.borders.plist", type = "template" }
"config/custom/launchagents/com.user.colima.plist" = { target = "~/Library/LaunchAgents/com.user.colima.plist", type = "template" }
"config/custom/launchagents/com.user.agentgateway.plist" = { target = "~/Library/LaunchAgents/com.user.agentgateway.plist", type = "template" }
"config/custom/agentgateway/config.yaml" = { target = "~/.config/agentgateway/config.yaml", type = "template" }

# ─── Omarchy = base only. Desktop stack (config/linux) and /etc stay omarchy-managed
#     until each piece is reviewed mine-vs-omarchy; host profile excludes collisions. ───
[omarchy]
depends = ["base"]

[omarchy.files]
# KUB-79: agentgateway as a systemd user unit. config.yaml is a template (work routes are mac-only).
"config/custom/agentgateway/config.yaml" = { target = "~/.config/agentgateway/config.yaml", type = "template" }
"config/omarchy/systemd/agentgateway.service" = "~/.config/systemd/user/agentgateway.service"
# KUB-122: own maintenance timers (omarchy has none besides snapper-cleanup); post_deploy enables them.
"config/omarchy/systemd/btrfs-space-monitor.service" = "~/.config/systemd/user/btrfs-space-monitor.service"
"config/omarchy/systemd/btrfs-space-monitor.timer" = "~/.config/systemd/user/btrfs-space-monitor.timer"
"config/omarchy/systemd/git-maintenance-sync.service" = "~/.config/systemd/user/git-maintenance-sync.service"
"config/omarchy/systemd/git-maintenance-sync.timer" = "~/.config/systemd/user/git-maintenance-sync.timer"
"config/omarchy/systemd/screenshot-cleanup.service" = "~/.config/systemd/user/screenshot-cleanup.service"
"config/omarchy/systemd/screenshot-cleanup.timer" = "~/.config/systemd/user/screenshot-cleanup.timer"
# KUB-102: Hyprland override points. omarchy-refresh-hyprland targets → dotter owns them; omarchy's originals
# are kept as ~/.config/hypr/*.omarchy-bak. hyprland.lua + .luarc.json are verbatim omarchy copies.
"config/omarchy/hypr" = "~/.config/hypr"
# KUB-111/118: omarchy user override points, per-file symlinks into ~/.config/omarchy (omarchy's own dirs stay).
#   shell.json (bar layout, idle; original: shell.json.omarchy-bak), shell.toml (font base-size),
#   themed/*.tpl (rendered on theme-set), hooks/theme-set.d/zen.
# `omarchy bar|plugin|refresh shell` and `omarchy display text size` `mv` over the symlinks → dotter dry-run
# collision; see docs/troubleshooting/omarchy-refresh-writes-through-symlinks.md.
"config/omarchy/omarchy" = "~/.config/omarchy"
# KUB-122: udiskie device rules (omarchy autostarts udiskie; config.yml is read regardless of its flags).
"config/omarchy/udiskie" = "~/.config/udiskie"
# KUB-122: pipewire drop-ins (switch-on-connect, rnnoise "Noise Canceling source"); easyeffects presets (user data).
"config/omarchy/pipewire" = "~/.config/pipewire"
"config/omarchy/easyeffects" = "~/.config/easyeffects"

# ─── Arch = base + linux + system files (/etc, root) ───
[arch]
depends = ["base", "linux"]

[arch.files]
"etc" = { target = "/etc", type = "template", owner = "root" }
