packages = ["omarchy"]

[files]
# Omarchy ships its own config for these. Mine-vs-omarchy is decided per tool
# during the migration (M2); until then leave omarchy's in place.
# (Exclusion only works on exact entry keys. Sub-paths of config/shared such as
#  alacritty/kitty/starship can't be excluded here; dotter skips the colliding
#  files on its own — "target already exists" — which has the same effect.)
"config/custom/ghostty" = ""
"config/custom/tmux" = ""
"config/custom/nvim" = ""

[variables]
gh_binary = "/home/kuba/.local/bin/gh"
delta_theme_path = "/home/kuba/.config/delta/catppuccin.gitconfig"
tpm_path = "/usr/share/tmux-plugin-manager/tpm"
op_agent_sock = "~/.1password/agent.sock"
home_dir = "/home/kuba"
is_linux = true
# Work mac on the home LAN; set in .dotter/local.toml (gitignored). Empty = no `Host mac` block.
mac_lan_ip = ""
mac_user = ""
